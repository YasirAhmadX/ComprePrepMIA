<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ComprePrep MIA</title>
  <meta name="description" content="Study guides, the full question bank with answers and explanations, practice mode and timed mock tests for the CSE1907 Comprehensive Examination.">
  <!-- Fallback redirect if JavaScript is disabled -->
  <meta http-equiv="refresh" content="0; url=website/">
  <link rel="canonical" href="website/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M9 17.5l4.5 4.5L23 11' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    // Relative path so it works at a domain root or under a sub-path; keeps any #/route deep link
    location.replace('website/' + location.search + location.hash);
  </script>
  <style>
    :root { color-scheme: light; --bg: #f6f6f3; --surface: #ffffff; --text: #0b0b0b; --text-2: #52514e; --accent: #1f6cc9; --border: rgba(11, 11, 11, 0.10); }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --bg: #0d0d0d; --surface: #1a1a19; --text: #ffffff; --text-2: #c3c2b7; --accent: #86b6ef; --border: rgba(255, 255, 255, 0.10); }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card { max-width: 420px; width: 100%; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px 24px; }
    .mark { display: inline-flex; margin-bottom: 12px; }
    h1 { font-size: 1.3rem; margin: 0 0 6px; }
    h1 b { color: var(--accent); }
    p { margin: 0 0 16px; color: var(--text-2); }
    a.btn { display: inline-block; padding: 9px 18px; border-radius: 10px; background: #1f6cc9; color: #fff; text-decoration: none; font-weight: 600; }
    a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="40" height="40"><rect width="32" height="32" rx="8" fill="#2a78d6"/><path d="M9 17.5l4.5 4.5L23 11" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <h1>ComprePrep <b>MIA</b></h1>
    <p>Taking you to the study site…</p>
    <a class="btn" href="website/">Open ComprePrep MIA</a>
  </main>
</body>
</html>
